<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result | Parinaam</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body class="result-page">
  <div class="bg-decoration">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <main class="container">
    <header class="header animate-fade-in">
      <h1 class="brand">PARINAAM</h1>
      <a href="index.html" class="btn-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Exit Portal</span>
      </a>
    </header>

    <section id="resultBox" class="result-section animate-slide-up">
      <div class="glass-card result-card">
        <div class="card-glow"></div>
        <div class="empty-state">
          <p class="empty-title">Loading result...</p>
          <p class="empty-text">Please wait while we fetch the academic record.</p>
        </div>
      </div>
    </section>

    <footer class="footer animate-fade-in">
      <p>&copy; 2026 Parinaam Education Board. All rights reserved.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
