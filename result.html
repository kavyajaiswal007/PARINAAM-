<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parinaam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <p class="brand-name">Parinaam</p>
    <p class="brand-dot"></p>
  </header>

  <main class="page-wrapper">
    <section class="result-shell">
      <div class="result-shell-head">
        <div>
          <p class="eyebrow">Parinaam</p>
          <h1 class="result-page-title">Parinaam Result</h1>
        </div>
        <a class="back-link" href="index.html">Search Another Roll Number</a>
      </div>

      <section id="resultBox" class="result-box">
        <div class="empty-state">
          <p class="empty-title">Loading result...</p>
          <p class="empty-text">Please wait while we fetch the academic record.</p>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
