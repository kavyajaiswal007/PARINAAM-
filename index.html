<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parinaam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top branding area -->
  <header class="top-bar">
    <p class="brand-name">Parinaam</p>
    <p class="brand-dot"></p>
  </header>

  <!-- Main wrapper keeps the layout centered -->
  <main class="page-wrapper">
    <!-- Search card -->
    <section class="search-card">
      <p class="eyebrow">Parinaam</p>
      <h1>Parinaam</h1>
      <p class="intro-text">Enter a roll number to access academic records.</p>

      <div class="input-group">
        <label for="rollNumber">Enter Roll Number</label>
        <input
          type="text"
          id="rollNumber"
          placeholder="e.g. 101"
          autocomplete="off"
        >
      </div>

      <button id="checkResultBtn">Check Result</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
